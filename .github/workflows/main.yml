name: Auto App Engine Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'My HTML App'
      html_base64:
        description: 'Base64 HTML'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create Native App Project
        run: |
          mkdir -p app/src/main/java/com/saas/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # ইউজার যে HTML পেস্ট করেছে তা অ্যাপের ভেতরে সেভ হবে
          echo "${{ github.event.inputs.html_base64 }}" | base64 -d > app/src/main/assets/index.html

          # gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'AppBuilder'
          include ':app'
          EOF

          # build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.saas.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.saas.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  manifestPlaceholders = [
                      onesignal_app_id: '0f4c32c6-8610-48f1-af69-7ed1f013b852',
                      onesignal_google_project_number: 'REMOTE'
                  ]
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.onesignal:OneSignal:[4.8.0, 4.99.99]'
          }
          EOF

          # styles.xml
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar"></style>
          </resources>
          EOF

          # strings.xml
          cat << EOF > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">${{ github.event.inputs.app_name }}</string>
          </resources>
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:name=".MainApplication"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainApplication.java
          cat << 'EOF' > app/src/main/java/com/saas/app/MainApplication.java
          package com.saas.app;
          import android.app.Application;
          import com.onesignal.OneSignal;

          public class MainApplication extends Application {
              private static final String ONESIGNAL_APP_ID = "0f4c32c6-8610-48f1-af69-7ed1f013b852";

              @Override
              public void onCreate() {
                  super.onCreate();
                  OneSignal.initWithContext(this);
                  OneSignal.setAppId(ONESIGNAL_APP_ID);
              }
          }
          EOF

          # MainActivity.java (পেস্ট করা HTML অফলাইন থেকে রান হবে)
          cat << 'EOF' > app/src/main/java/com/saas/app/MainActivity.java
          package com.saas.app;
          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.4

      - name: Build Debug APK
        run: |
          gradle assembleDebug
          mv app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/app-release.apk

      - name: Publish Direct APK Download
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_id }}
          files: app/build/outputs/apk/debug/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
